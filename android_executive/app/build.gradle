apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.gms.google-services'

android {
    namespace 'com.seventwonine.executive'
    compileSdk 35

    defaultConfig {
        applicationId "com.seventwonine.executive"
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName "1.0.0-SENTINEL"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Redmi / ARMv9 16KB Alignment Optimization
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.11'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.compose.ui:ui:1.6.7'
    implementation 'androidx.compose.material3:material3:1.2.1'
    // Firebase Data Connect integration
    implementation 'com.google.firebase:firebase-dataconnect:16.0.0-beta01'
    // Phase 2 Modules
    implementation project(":oivaru-news")
    implementation project(":koshaaru-lore")
}
